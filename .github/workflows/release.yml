name: Release containers

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, gateway, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/orivane-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: rust
        if: matrix.service != 'web'
        shell: bash
        run: |
          if [ "${{ matrix.service }}" = api ]; then
            echo 'package=discord-bot-api' >> "$GITHUB_OUTPUT"
            echo 'binary=discord-bot-api' >> "$GITHUB_OUTPUT"
          else
            echo 'package=discord-bot-gateway' >> "$GITHUB_OUTPUT"
            echo 'binary=discord-bot-gateway' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'web' && 'apps/web' || '.' }}
          file: ${{ matrix.service == 'web' && 'apps/web/Dockerfile' || 'Dockerfile.rust' }}
          build-args: |
            PACKAGE=${{ steps.rust.outputs.package }}
            BINARY=${{ steps.rust.outputs.binary }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

