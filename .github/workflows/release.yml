name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish without a leading v
        required: true
        type: string
      ref:
        description: Commit, tag, or branch to build
        required: true
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Prepare GitHub release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ matrix.service }} image
    needs: release
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (needs.release.result == 'success' && needs.release.outputs.release_created == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, gateway, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || needs.release.outputs.sha }}
      - id: version
        name: Resolve release metadata
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release.outputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version, received: $RELEASE_VERSION" >&2
            exit 1
          fi
          IFS=. read -r major minor _ <<< "$RELEASE_VERSION"
          {
            echo "version=$RELEASE_VERSION"
            echo "major=$major"
            echo "minor=$minor"
            echo "sha=$(git rev-parse HEAD)"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/orivane-${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Orivane ${{ matrix.service }}
            org.opencontainers.image.description=Orivane Discord bot ${{ matrix.service }} service
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
      - id: rust
        if: matrix.service != 'web'
        shell: bash
        run: |
          if [ "${{ matrix.service }}" = api ]; then
            echo 'binary=discord-bot-api' >> "$GITHUB_OUTPUT"
          else
            echo 'binary=discord-bot-gateway' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service == 'web' && 'apps/web' || '.' }}
          file: ${{ matrix.service == 'web' && 'apps/web/Dockerfile' || 'Dockerfile.rust' }}
          build-args: |
            BINARY=${{ steps.rust.outputs.binary }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orivane-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=orivane-${{ matrix.service }}
          provenance: mode=max
          sbom: true
