global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: orivane-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:3010]
  - job_name: orivane-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:3011]
