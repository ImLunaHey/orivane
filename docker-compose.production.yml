services:
  api:
    image: ghcr.io/imlunahey/orivane-api:${ORIVANE_VERSION:?Set ORIVANE_VERSION to an exact release version}
    build: !reset null
    pull_policy: always

  gateway:
    image: ghcr.io/imlunahey/orivane-gateway:${ORIVANE_VERSION:?Set ORIVANE_VERSION to an exact release version}
    build: !reset null
    pull_policy: always

  mcp:
    image: ghcr.io/imlunahey/orivane-mcp:${ORIVANE_VERSION:?Set ORIVANE_VERSION to an exact release version}
    build: !reset null
    pull_policy: always

  docs:
    image: ghcr.io/imlunahey/orivane-docs:${ORIVANE_VERSION:?Set ORIVANE_VERSION to an exact release version}
    build: !reset null
    pull_policy: always

  web:
    image: ghcr.io/imlunahey/orivane-web:${ORIVANE_VERSION:?Set ORIVANE_VERSION to an exact release version}
    build: !reset null
    pull_policy: always
