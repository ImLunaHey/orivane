services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: discord
      POSTGRES_USER: discord
      POSTGRES_PASSWORD: discord
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        BINARY: discord-bot-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://discord:discord@postgres:5432/discord
      REDIS_URL: redis://redis:6379
      API_BIND: 0.0.0.0:3010
      API_CORS_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:${API_PORT:-3010}:3010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3010/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        BINARY: discord-bot-gateway
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://discord:discord@postgres:5432/discord
      REDIS_URL: redis://redis:6379
      GATEWAY_METRICS_BIND: 0.0.0.0:3011
    ports:
      - "127.0.0.1:${GATEWAY_METRICS_PORT:-3011}:3011"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3011/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        BINARY: discord-bot-mcp
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      MCP_BIND: 0.0.0.0:3012
      ORIVANE_API_BASE_URL: http://api:3010/
      MCP_ALLOWED_ORIGINS: ${APP_ORIGIN:-http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:${MCP_PORT:-3012}:3012"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3012/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  docs:
    build:
      context: apps/docs
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DOCS_PORT:-5174}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
      docs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

